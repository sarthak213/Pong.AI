<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pong.AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <!-- ── Header: brand + scoreboard + controls ── -->
        <header>
            <span class="brand">Pong.AI</span>

            <div class="scoreboard-wrap">
                <div class="scoreboard">

                    <!-- Player side -->
                    <div class="player-block" id="playerBlock">
                        <input id="playerName" class="name-input" value="Player" maxlength="14" autocomplete="off" spellcheck="false">
                        <div id="playerScore" class="score cyan">0</div>
                        <div class="game-dots" id="playerGames">
                            <span class="game-dot" data-game="1"></span>
                            <span class="game-dot" data-game="2"></span>
                            <span class="game-dot" data-game="3"></span>
                            <span class="game-dot" data-game="4"></span>
                        </div>
                        <div id="playerStatus" class="player-status"></div>
                    </div>

                    <div class="vs-col">
                        <span class="vs">vs</span>
                        <span class="game-number" id="gameNumber"></span>
                    </div>

                    <!-- AI side -->
                    <div class="player-block" id="aiBlock">
                        <span class="name-label">AI</span>
                        <div id="aiScore" class="score orange">0</div>
                        <div class="game-dots" id="aiGames">
                            <span class="game-dot" data-game="1"></span>
                            <span class="game-dot" data-game="2"></span>
                            <span class="game-dot" data-game="3"></span>
                            <span class="game-dot" data-game="4"></span>
                        </div>
                        <div id="aiStatus" class="player-status"></div>
                    </div>

                </div>

                <!-- Deuce pill — centered below entire scoreboard, shown only during deuce -->
                <div class="deuce-row">
                    <span id="deuceStatus" class="deuce-pill" style="display:none;"></span>
                </div>
            </div>

            <div class="header-controls">
                <button id="pauseBtn">Pause</button>
                <button id="restartBtn" class="btn-accent">Restart</button>
            </div>
        </header>

        <!-- ── Main three-column layout ── -->
        <main class="three-column">

            <!-- Left panel: powerups + match info -->
            <aside class="side-panel left-panel">
                <div class="panel-card">
                    <div class="panel-label">Powerups</div>
                    <div class="pip-row" id="powerupLeft">
                        <span class="pip pip-filled"></span>
                        <span class="pip pip-filled"></span>
                    </div>
                    <div class="powerup-active" id="powerupActive">—</div>
                    <div class="powerup-keys">
                        <span class="key-hint"><kbd>W</kbd> Speed</span>
                        <span class="key-hint"><kbd>D</kbd> Size</span>
                    </div>
                </div>
                <div class="panel-card" id="extremePanel">
                    <div class="panel-label">Status</div>
                    <div class="extreme-status-text" id="extremeStatusText">Normal</div>
                </div>
            </aside>

            <!-- Centre: canvas + overlay -->
            <section class="center-panel">
                <canvas id="pong" width="900" height="600"></canvas>
                <div class="overlay" id="overlay">
                    <div id="message" class="overlay-msg">Click or press Space to start</div>
                    <button id="overlayRestart" style="display:none;">Restart</button>
                </div>
            </section>

            <!-- Right panel: AI settings -->
            <aside class="side-panel right-panel">
                <div class="panel-card">
                    <div class="panel-label">AI difficulty</div>
                    <div class="slider-row">
                        <input id="aiDifficulty" type="range" min="1" max="5" value="3">
                        <span class="slider-val" id="aiDiffLabel">3</span>
                    </div>
                </div>
                <div class="panel-card">
                    <div class="panel-label">Speed ramp</div>
                    <div class="slider-row">
                        <input id="rampTime" type="range" min="1" max="60" value="10">
                        <span class="slider-val" id="rampLabel">10s</span>
                    </div>
                </div>
                <div class="panel-card">
                    <div class="panel-label">Trajectory</div>
                    <label class="toggle-switch">
                        <input id="trajToggle" type="checkbox" checked>
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        <span class="toggle-label" id="trajLabel">On</span>
                    </label>
                </div>
                <div class="panel-card">
                    <div class="panel-label">Extreme mode</div>
                    <label class="toggle-switch">
                        <input id="extremeMode" type="checkbox">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        <span class="toggle-label" id="extremeLabel">Off</span>
                    </label>
                </div>
            </aside>

        </main>

        <!-- ── Footer: match format selector ── -->
        <footer>
            <div class="footer-inner">
                <span class="footer-label">Match format</span>
                <div class="format-tabs">
                    <button class="match-format-btn" data-format="one">One-shot</button>
                    <button class="match-format-btn active" data-format="best3">Best of 3</button>
                    <button class="match-format-btn" data-format="best5">Best of 5</button>
                    <button class="match-format-btn" data-format="best7">Best of 7</button>
                </div>
            </div>
        </footer>

    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
