<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#12202a"/>
      <stop offset="100%" stop-color="#090c10"/>
    </radialGradient>
    <linearGradient id="player" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cf2fa"/>
      <stop offset="100%" stop-color="#00a9b3"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa468"/>
      <stop offset="100%" stop-color="#e55f0e"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6f4ff"/>
      <stop offset="100%" stop-color="#9dc0dc"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- net -->
  <path d="M128 36v184" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>

  <!-- paddles -->
  <rect x="34" y="58" width="30" height="104" rx="10" fill="#00d4e0" opacity="0.45" filter="url(#glow)"/>
  <rect x="34" y="58" width="30" height="104" rx="10" fill="url(#player)"/>
  <rect x="192" y="102" width="30" height="104" rx="10" fill="#ff7c2a" opacity="0.45" filter="url(#glow)"/>
  <rect x="192" y="102" width="30" height="104" rx="10" fill="url(#ai)"/>

  <!-- ball with motion trail, heading toward the AI -->
  <path d="M84 104 L160 133 L140 163 Z" fill="url(#trail)"/>
  <circle cx="150" cy="148" r="24" fill="#ffffff" opacity="0.5" filter="url(#glow)"/>
  <circle cx="150" cy="148" r="21" fill="url(#ball)"/>
</svg>
