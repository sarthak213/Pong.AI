<!DOCTYPE html>
<html lang="en" data-game-theme="neon">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard · Pong.AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Top scores and recent matches against the Pong.AI opponent.">
    <script>try{var t=localStorage.getItem('pongai-theme');if(['neon','retro','synthwave','arctic'].indexOf(t)>=0)document.documentElement.dataset.gameTheme=t;}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#090c10">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" href="index.html" aria-label="Pong.AI home">
            <span class="brand-ping"></span>
            <span>Pong<span class="dot">.</span>AI</span>
        </a>
        <nav class="site-nav" aria-label="Main">
            <a href="index.html"><i data-lucide="gamepad-2"></i><span class="nav-label">Play</span></a>
            <a href="leaderboard.html" aria-current="page"><i data-lucide="trophy"></i><span class="nav-label">Leaderboard</span></a>
            <a href="how-to-play.html"><i data-lucide="book-open"></i><span class="nav-label">How to Play</span></a>
        </nav>
        <div class="header-themes theme-switcher" role="radiogroup" aria-label="Theme" data-theme-picker="swatch"></div>
    </div>
</header>

<main class="container narrow">
    <div class="panel-head fade-up" style="--i:0; align-items:flex-end; flex-wrap:wrap; margin-bottom:24px">
        <div>
            <h1 class="page-title"><i data-lucide="trophy" class="text-gold"></i> Leaderboard</h1>
            <p class="page-lede">Every finished match is recorded here.</p>
        </div>
        <a class="btn btn-primary shadow-soft" href="index.html"><i data-lucide="play"></i> Play now</a>
    </div>

    <div class="lb-controls fade-up" style="--i:1">
        <div class="seg" role="tablist" aria-label="View">
            <button role="tab" data-view="top"><i data-lucide="trophy"></i> Top scores</button>
            <button role="tab" data-view="recent"><i data-lucide="clock"></i> Recent</button>
            <button role="tab" data-view="players"><i data-lucide="users"></i> Players</button>
        </div>
        <div class="seg subtle" role="radiogroup" aria-label="Difficulty filter">
            <button role="radio" data-diff="all">All</button>
            <button role="radio" data-diff="easy">Easy</button>
            <button role="radio" data-diff="medium">Medium</button>
            <button role="radio" data-diff="hard">Hard</button>
            <button role="radio" data-diff="extreme">Extreme</button>
        </div>
    </div>

    <section class="card pad shadow-soft fade-up" style="--i:2" aria-live="polite">
        <div id="lbContent"></div>
    </section>

    <p class="page-note"><i data-lucide="info"></i><span id="formulaNote"></span></p>
</main>

<script type="module" src="leaderboard-page.js"></script>
</body>
</html>
